<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fraction Notes • Core Loop v2</title>
  <script>
    (function () {
      function assetBase() {
        var p = location.pathname;
        if (p.endsWith('/')) return p;
        if (/\.[a-zA-Z0-9]+$/.test(p.split('/').pop() || '')) return p.replace(/\/[^/]*$/, '/');
        return p + '/';
      }
      window.__assetBase = assetBase();
      var s = document.createElement('style');
      s.textContent = "@font-face{font-family:'Noto Music';font-style:normal;font-weight:400;font-display:swap;src:url('" + window.__assetBase + "fonts/NotoMusic-Regular.ttf') format('truetype');}";
      document.head.appendChild(s);
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .note-btn { transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1); }
    .note-btn:active { transform: scale(0.92); }
    .note-svg { fill: #fff; pointer-events: none; display: block; }
    .note-icon-slot {
      height: 4.5rem;
      width: 4.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .note-icon-slot svg {
      max-height: 100%;
      max-width: 100%;
      height: auto;
      width: auto;
    }
    .note-icon-slot--semibreve {
      width: auto;
      height: 4.5rem;
      overflow: visible;
    }
    .note-icon-slot--semibreve .note-svg--wide {
      height: 4.5rem;
      width: auto;
      max-height: none;
      max-width: none;
    }
    .note-icon-slot .note-glyph {
      font-size: 4.5rem;
      line-height: 1;
    }
    .note-unicode {
      display: none;
      font-family: 'Noto Music', sans-serif;
    }
    body.music-font-ready .note-unicode { display: block; }
    body.music-font-ready .note-fallback-svg { display: none !important; }
    body.music-font-ready .note-fallback-text { display: none; }
    .music-font { font-family: 'Noto Music', sans-serif; }
    .notes-glyph-sm { font-size: 1.5rem; line-height: 1; vertical-align: middle; }
    .notes-glyph-eq { font-size: 1.25rem; line-height: 1; vertical-align: -0.15em; }
    .notes-icon-sm { height: 1.5rem; width: auto; vertical-align: middle; }
    .notes-icon-eq { height: 1.25rem; width: auto; vertical-align: -0.15em; }
    body.embedded { padding: 0; }
    body.embedded .adventure-embed-hide { display: none; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-violet-950 to-slate-900 text-white min-h-screen">

  </svg>

  <div class="max-w-4xl mx-auto p-6 adventure-shell">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8 adventure-embed-hide">
      <div>
        <a href="index.html" class="text-sm font-medium text-violet-300 hover:text-white transition-colors">← All Apps</a>
        <h1 class="text-4xl font-bold mt-1">Fraction Notes</h1>
        <p class="text-violet-400">1 Crotchet = 1 Beat</p>
      </div>
      <button onclick="resetAll()" 
              class="px-5 py-2.5 bg-white/10 hover:bg-white/20 rounded-2xl text-sm font-medium">
        Reset
      </button>
    </div>

    <!-- Note Palette -->
    <div class="mb-8">
      <h2 class="text-lg font-semibold mb-3 text-violet-300">Add Notes</h2>
      <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
        
        <!-- Semibreve -->
        <button onclick="addNote('semibreve', 4)" 
                class="note-btn p-5 bg-red-600 hover:bg-red-500 rounded-3xl flex flex-col items-center">
          <div class="note-icon-slot note-icon-slot--semibreve mb-1">
            <span class="note-glyph note-unicode" aria-hidden="true">𝅝</span>
            <svg viewBox="0 0 15.698 7.087" class="note-svg note-svg--wide note-fallback-svg" aria-hidden="true"><use href="#note-semibreve"/></svg>
          </div>
          <div class="font-bold">Semibreve</div>
          <div class="text-xl font-mono text-red-200">4 beats</div>
        </button>

        <!-- Minim -->
        <button onclick="addNote('minim', 2)" 
                class="note-btn p-5 bg-amber-600 hover:bg-amber-500 rounded-3xl flex flex-col items-center">
          <div class="note-icon-slot mb-1">
            <span class="note-glyph note-unicode" aria-hidden="true">𝅗𝅥</span>
            <svg viewBox="0 0 75 150" class="note-svg note-fallback-svg" aria-hidden="true"><use href="#note-minim"/></svg>
          </div>
          <div class="font-bold">Minim</div>
          <div class="text-xl font-mono text-amber-200">2 beats</div>
        </button>

        <!-- Crotchet -->
        <button onclick="addNote('crotchet', 1)" 
                class="note-btn p-5 bg-sky-600 hover:bg-sky-500 rounded-3xl flex flex-col items-center">
          <div class="note-icon-slot mb-1">
            <span class="note-glyph note-unicode" aria-hidden="true">&#x1D15F;</span>
            <span class="note-glyph note-fallback-text" aria-hidden="true">♩</span>
          </div>
          <div class="font-bold">Crotchet</div>
          <div class="text-xl font-mono text-sky-200">1 beat</div>
        </button>

        <!-- Quaver -->
        <button onclick="addNote('quaver', 0.5)" 
                class="note-btn p-5 bg-emerald-600 hover:bg-emerald-500 rounded-3xl flex flex-col items-center">
          <div class="note-icon-slot mb-1">
            <span class="note-glyph note-unicode" aria-hidden="true">&#x1D160;</span>
            <span class="note-glyph note-fallback-text" aria-hidden="true">♪</span>
          </div>
          <div class="font-bold">Quaver</div>
          <div class="text-xl font-mono text-emerald-200">½ beat</div>
        </button>

        <!-- Semiquaver -->
        <button onclick="addNote('semiquaver', 0.25)" 
                class="note-btn p-5 bg-violet-600 hover:bg-violet-500 rounded-3xl flex flex-col items-center">
          <div class="note-icon-slot mb-1">
            <span class="note-glyph note-unicode" aria-hidden="true">𝅘𝅥𝅯</span>
            <svg viewBox="0 0 75 150" class="note-svg note-fallback-svg" aria-hidden="true"><use href="#note-semiquaver"/></svg>
          </div>
          <div class="font-bold">Semiquaver</div>
          <div class="text-xl font-mono text-violet-200">¼ beat</div>
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
      
      <!-- Music Measure Bar -->
      <div class="lg:col-span-3 bg-white/5 backdrop-blur-lg rounded-3xl p-6 border border-white/10">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-semibold text-lg">4-Beat Bar</h3>
          <div id="total-text" class="font-mono text-3xl font-bold">0 beats</div>
        </div>
        
        <div id="measure-bar" class="h-16 bg-white/10 rounded-2xl overflow-hidden flex border border-white/20 mb-4"></div>

        <div id="equation" class="min-h-[28px] text-center text-lg font-medium text-violet-300">
          Add notes to begin
        </div>
      </div>

      <!-- Fraction Visuals -->
      <div class="lg:col-span-2 bg-white/5 backdrop-blur-lg rounded-3xl p-6 border border-white/10">
        <h3 class="font-semibold mb-3">Fraction of the Bar(s)</h3>
        <div id="fraction-visual" class="min-h-[180px] flex flex-wrap items-center justify-center gap-4 bg-white/5 rounded-2xl p-4">
          <!-- Pies go here -->
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex flex-wrap gap-4 justify-center mt-8">
      <button onclick="playRhythm()" 
              class="px-16 py-4 text-2xl font-bold bg-emerald-600 hover:bg-emerald-500 rounded-3xl flex items-center gap-3 shadow-xl">
        ▶️ Play Rhythm
      </button>
      <button onclick="clearSequence()" 
              class="px-8 py-4 text-xl font-semibold bg-white/10 hover:bg-white/20 rounded-3xl">
        Clear
      </button>
    </div>
  </div>

  <script>
    const MUSIC_FONT = 'Noto Music';
    const MUSIC_NOTE_CHARS = {
      semibreve: '\uD834\uDD5D',
      minim: '\uD834\uDD5E',
      crotchet: '\uD834\uDD5F',
      quaver: '\uD834\uDD60',
      semiquaver: '\uD834\uDD61',
    };
    const LEGACY_NOTE_CHARS = { crotchet: '♩', quaver: '♪' };
    const SVG_NOTE_TYPES = new Set(['semibreve', 'minim', 'semiquaver']);
    let useMusicFont = false;

    const NOTE_SVG_SPECS = {
      semibreve: { id: 'note-semibreve', viewBox: '0 0 15.698 7.087', width: 95, height: 42 },
      minim: { id: 'note-minim', viewBox: '0 0 75 150', width: 48, height: 95 },
      semiquaver: { id: 'note-semiquaver', viewBox: '0 0 75 150', width: 48, height: 95 },
    };

    function noteSvgHtml(type, className = 'note-svg', size = 'md') {
      const spec = NOTE_SVG_SPECS[type];
      if (!spec) return '';
      const sizes = {
        md: { semibreve: [spec.width, spec.height], minim: [spec.width, spec.height], semiquaver: [spec.width, spec.height] },
        sm: { semibreve: [24, 11], minim: [12, 24], semiquaver: [12, 24] },
        eq: { semibreve: [20, 9], minim: [10, 20], semiquaver: [10, 20] },
      };
      const [w, h] = (sizes[size] || sizes.md)[type] || [spec.width, spec.height];
      return `<svg width="${w}" height="${h}" viewBox="${spec.viewBox}" class="${className}" aria-hidden="true"><use href="#${spec.id}"/></svg>`;
    }

    async function initMusicFont() {
      if (!document.fonts) return;
      const testChar = MUSIC_NOTE_CHARS.semibreve;
      const fontSpec = `48px "${MUSIC_FONT}"`;
      try {
        const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 5000));
        await Promise.race([document.fonts.load(fontSpec, testChar), timeout]);
        await document.fonts.ready;
        if (!document.fonts.check(fontSpec, testChar)) return;
        useMusicFont = true;
        document.body.classList.add('music-font-ready');
        if (sequence.length) updateUI();
      } catch { /* SVG fallback */ }
    }

    let sequence = [];
    let audioCtx = null;

    function noteSymbolHtml(type, size = 'bar') {
      if (useMusicFont) {
        const sym = MUSIC_NOTE_CHARS[type] || '?';
        const textCls = size === 'eq' ? 'music-font notes-glyph-eq' : 'music-font notes-glyph-sm drop-shadow';
        return `<span class="${textCls}">${sym}</span>`;
      }
      if (SVG_NOTE_TYPES.has(type)) {
        const cls = size === 'eq' ? 'note-svg notes-icon-eq' : 'note-svg notes-icon-sm';
        return noteSvgHtml(type, cls, size === 'eq' ? 'eq' : 'sm');
      }
      const sym = LEGACY_NOTE_CHARS[type] || '?';
      const textCls = size === 'eq' ? 'text-base' : 'text-lg drop-shadow';
      return `<span class="${textCls}">${sym}</span>`;
    }

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function addNote(type, beats) {
      sequence.push({ type, beats });
      updateUI();
    }

    function clearSequence() {
      sequence = [];
      updateUI();
    }

    function getTotalBeats() {
      return sequence.reduce((sum, n) => sum + n.beats, 0);
    }

    function updateUI() {
      const bar = document.getElementById('measure-bar');
      bar.innerHTML = '';

      sequence.forEach(note => {
        const seg = document.createElement('div');
        seg.className = `h-full flex items-center justify-center text-xs font-bold text-white/90 ${getColor(note.type)}`;
        seg.style.width = `${(note.beats / 4) * 100}%`;
        seg.innerHTML = noteSymbolHtml(note.type, 'bar');
        bar.appendChild(seg);
      });

      const total = getTotalBeats();
      document.getElementById('total-text').textContent = `${total} beats`;
      updateEquation(total);
      updateFractionVisuals(total);
    }

    function getColor(type) {
      if (type === 'semibreve') return 'bg-red-500';
      if (type === 'minim') return 'bg-amber-500';
      if (type === 'crotchet') return 'bg-sky-500';
      if (type === 'quaver') return 'bg-emerald-500';
      return 'bg-violet-500';
    }

    function updateEquation(total) {
      const eq = document.getElementById('equation');
      if (sequence.length === 0) {
        eq.textContent = 'Add notes to begin';
        return;
      }
      const symbols = sequence.map(n => noteSymbolHtml(n.type, 'eq'));
      eq.innerHTML = `${symbols.join(' + ')} = <span class="font-bold">${total} beats</span>`;
    }

    function updateFractionVisuals(totalBeats) {
      const container = document.getElementById('fraction-visual');
      container.innerHTML = '';

      const fullPies = Math.floor(totalBeats / 4);
      const remainder = totalBeats % 4;

      // Full pies
      for (let i = 0; i < fullPies; i++) {
        container.appendChild(createPie(100));
      }

      // Partial pie
      if (remainder > 0) {
        container.appendChild(createPie((remainder / 4) * 100));
      }

      if (totalBeats === 0) {
        container.innerHTML = `<div class="text-white/40 text-sm">Add notes to see the fraction</div>`;
      }
    }

    function createPie(percent) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("width", "100");
      svg.setAttribute("height", "100");
      svg.setAttribute("viewBox", "0 0 100 100");

      const angle = (percent / 100) * 360;

      // Background circle
      const bg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      bg.setAttribute("cx", "50");
      bg.setAttribute("cy", "50");
      bg.setAttribute("r", "45");
      bg.setAttribute("fill", "#334155");
      svg.appendChild(bg);

      // Filled slice (fixed for 100%)
      if (percent > 0) {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        let d;

        if (percent >= 100) {
          // Full circle
          d = `M 50 50 m -45 0 a 45 45 0 1 0 90 0 a 45 45 0 1 0 -90 0`;
        } else {
          const largeArc = angle > 180 ? 1 : 0;
          const rad = (angle - 90) * Math.PI / 180;
          const x = 50 + 45 * Math.cos(rad);
          const y = 50 + 45 * Math.sin(rad);
          d = `M 50 50 L 50 5 A 45 45 0 ${largeArc} 1 ${x} ${y} Z`;
        }

        path.setAttribute("d", d);
        path.setAttribute("fill", "#22c55e");
        svg.appendChild(path);
      }

      // Slice lines
      for (let i = 0; i < 8; i++) {
        const lineAngle = (i * 45) - 90;
        const rad = lineAngle * Math.PI / 180;
        const x = 50 + 45 * Math.cos(rad);
        const y = 50 + 45 * Math.sin(rad);

        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", "50");
        line.setAttribute("y1", "50");
        line.setAttribute("x2", x);
        line.setAttribute("y2", y);
        line.setAttribute("stroke", "#166534");
        line.setAttribute("stroke-width", "1.5");
        svg.appendChild(line);
      }

      // Outer ring
      const ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      ring.setAttribute("cx", "50");
      ring.setAttribute("cy", "50");
      ring.setAttribute("r", "45");
      ring.setAttribute("fill", "none");
      ring.setAttribute("stroke", "#166534");
      ring.setAttribute("stroke-width", "3");
      svg.appendChild(ring);

      return svg;
    }

    let activeOscillators = [];

    function playRhythm() {
      stopRhythm();
      initAudio();
      if (sequence.length === 0) return;

      const beatDuration = 0.5;
      let time = audioCtx.currentTime + 0.1;

      sequence.forEach(note => {
        const duration = note.beats * beatDuration;
        playNote(time, duration, note.type);
        time += duration;
      });
    }

    function stopRhythm() {
      activeOscillators.forEach(osc => {
        try { osc.stop(); osc.disconnect(); } catch {}
      });
      activeOscillators = [];
    }

    function playNote(startTime, duration, type) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      if (type === 'semibreve') osc.frequency.value = 330;
      else if (type === 'minim') osc.frequency.value = 392;
      else if (type === 'crotchet') osc.frequency.value = 523;
      else if (type === 'quaver') osc.frequency.value = 659;
      else osc.frequency.value = 784;

      gain.gain.value = 0.6;
      gain.gain.linearRampToValueAtTime(0, startTime + duration * 0.85);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.2);
      activeOscillators.push(osc);
    }

    function resetAll() {
      sequence = [];
      updateUI();
    }

    function init() {
      sequence = [
        { type: 'crotchet', beats: 1 },
        { type: 'crotchet', beats: 1 },
        { type: 'minim', beats: 2 }
      ];
      updateUI();
    }

    if (window.self !== window.top) {
      document.body.classList.add('embedded');
    }

    initMusicFont();
    window.onload = resetAll;
  </script>
</body>
</html>
