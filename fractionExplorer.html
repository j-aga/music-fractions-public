<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fraction Explorer</title>
  <script>
    (function () {
      function assetBase() {
        var p = location.pathname;
        if (p.endsWith('/')) return p;
        if (/\.[a-zA-Z0-9]+$/.test(p.split('/').pop() || '')) return p.replace(/\/[^/]*$/, '/');
        return p + '/';
      }
      window.__assetBase = assetBase();
      var s = document.createElement('style');
      s.textContent = "@font-face{font-family:'Noto Music';font-style:normal;font-weight:400;font-display:swap;src:url('" + window.__assetBase + "fonts/NotoMusic-Regular.ttf') format('truetype');}";
      document.head.appendChild(s);
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .note-btn { transition: all 0.1s ease; }
    .note-btn:active { transform: scale(0.95); }
    body.embedded { padding: 0; }
    body.embedded .explorer-embed-hide { display: none; }
    body.embedded .explorer-shell { padding-top: 1rem; }
    .note-svg { fill: #fff; pointer-events: none; display: block; }
    .note-icon-slot {
      height: 4.5rem;
      width: 4.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .note-icon-slot svg {
      max-height: 100%;
      max-width: 100%;
      height: auto;
      width: auto;
    }
    .note-icon-slot--semibreve {
      width: auto;
      height: 4.5rem;
      overflow: visible;
    }
    .note-icon-slot--semibreve .note-svg--wide {
      height: 4.5rem;
      width: auto;
      max-height: none;
      max-width: none;
    }
    .note-icon-slot .note-glyph {
      font-size: 4.5rem;
      line-height: 1;
    }
    .note-unicode {
      display: none;
      font-family: 'Noto Music', sans-serif;
    }
    body.music-font-ready .note-unicode { display: block; }
    body.music-font-ready .note-fallback-svg { display: none !important; }
    body.music-font-ready .note-fallback-text { display: none; }
    .music-font { font-family: 'Noto Music', sans-serif; }
    .note-icon-slot--lg {
      height: 5.5rem;
      width: 5.5rem;
    }
    .note-icon-slot--lg.note-icon-slot--semibreve {
      width: auto;
      height: 5.5rem;
    }
    .note-icon-slot--lg.note-icon-slot--semibreve .note-svg--wide {
      height: 5.5rem;
      width: auto;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-violet-950 to-slate-900 text-white min-h-screen">

      </g>
    </symbol>
  </svg>

  <div class="max-w-5xl mx-auto p-6 explorer-shell">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8 explorer-embed-hide">
      <div>
        <a href="index.html" class="text-sm font-medium text-violet-300 hover:text-white transition-colors">← All Apps</a>
        <h1 class="text-4xl font-bold mt-1">Fraction Explorer</h1>
        <p class="text-violet-400">Tap a note to explore its fraction</p>
      </div>
    </div>

    <!-- Note Buttons -->
    <div class="mb-10">
      <h2 class="text-xl font-semibold mb-4 text-violet-300">Choose a note</h2>
      <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
        
        <!-- Semibreve -->
        <button onclick="exploreNote('semibreve', 4, 'Semibreve')" 
                class="note-btn p-6 bg-red-600 hover:bg-red-500 rounded-3xl flex flex-col items-center">
          <div class="note-icon-slot note-icon-slot--semibreve mb-2">
            <span class="note-glyph note-unicode" aria-hidden="true">𝅝</span>
            <svg viewBox="0 0 15.698 7.087" class="note-svg note-svg--wide note-fallback-svg" aria-hidden="true"><use href="#note-semibreve"/></svg>
          </div>
          <div class="font-bold text-xl">Semibreve</div>
          <div class="text-red-200">4 beats</div>
        </button>

        <!-- Minim -->
        <button onclick="exploreNote('minim', 2, 'Minim')" 
                class="note-btn p-6 bg-amber-600 hover:bg-amber-500 rounded-3xl flex flex-col items-center">
          <div class="note-icon-slot mb-2">
            <span class="note-glyph note-unicode" aria-hidden="true">𝅗𝅥</span>
            <svg viewBox="0 0 75 150" class="note-svg note-fallback-svg" aria-hidden="true"><use href="#note-minim"/></svg>
          </div>
          <div class="font-bold text-xl">Minim</div>
          <div class="text-amber-200">2 beats</div>
        </button>

        <!-- Crotchet -->
        <button onclick="exploreNote('crotchet', 1, 'Crotchet')" 
                class="note-btn p-6 bg-sky-600 hover:bg-sky-500 rounded-3xl flex flex-col items-center">
          <div class="note-icon-slot mb-2">
            <span class="note-glyph note-unicode" aria-hidden="true">&#x1D15F;</span>
            <span class="note-glyph note-fallback-text" aria-hidden="true">♩</span>
          </div>
          <div class="font-bold text-xl">Crotchet</div>
          <div class="text-sky-200">1 beat</div>
        </button>

        <!-- Quaver -->
        <button onclick="exploreNote('quaver', 0.5, 'Quaver')" 
                class="note-btn p-6 bg-emerald-600 hover:bg-emerald-500 rounded-3xl flex flex-col items-center">
          <div class="note-icon-slot mb-2">
            <span class="note-glyph note-unicode" aria-hidden="true">&#x1D160;</span>
            <span class="note-glyph note-fallback-text" aria-hidden="true">♪</span>
          </div>
          <div class="font-bold text-xl">Quaver</div>
          <div class="text-emerald-200">½ beat</div>
        </button>

        <!-- Semiquaver -->
        <button onclick="exploreNote('semiquaver', 0.25, 'Semiquaver')" 
                class="note-btn p-6 bg-violet-600 hover:bg-violet-500 rounded-3xl flex flex-col items-center">
          <div class="note-icon-slot mb-2">
            <span class="note-glyph note-unicode" aria-hidden="true">𝅘𝅥𝅯</span>
            <svg viewBox="0 0 75 150" class="note-svg note-fallback-svg" aria-hidden="true"><use href="#note-semiquaver"/></svg>
          </div>
          <div class="font-bold text-xl">Semiquaver</div>
          <div class="text-violet-200">¼ beat</div>
        </button>
      </div>
    </div>

    <!-- Explorer Display -->
    <div id="explorer-display" class="hidden">
      <div class="bg-white/5 backdrop-blur-lg rounded-3xl p-8 border border-white/10 mb-8">
        <div class="flex flex-col md:flex-row items-center gap-8">
          <div class="text-center md:text-left">
            <div id="note-symbol" class="text-8xl mb-2"></div>
            <div id="note-name" class="text-4xl font-bold"></div>
            <div id="note-beats" class="text-2xl text-violet-300 mt-1"></div>
          </div>

          <div class="flex-1">
            <h3 class="font-semibold text-lg mb-3 text-violet-300">This is equal to:</h3>
            <div id="equivalents" class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-lg"></div>
          </div>
        </div>
      </div>

      <!-- Visual Representations -->
      <h3 class="font-semibold text-xl mb-4 text-violet-300">See it as a fraction of the bar</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Pizza -->
        <div class="visual-card bg-white/5 rounded-3xl p-6 border border-white/10">
          <h4 class="font-semibold mb-4 text-center">Pizza</h4>
          <div id="pizza-visual" class="flex justify-center"></div>
        </div>

        <!-- Chocolate -->
        <div class="visual-card bg-white/5 rounded-3xl p-6 border border-white/10">
          <h4 class="font-semibold mb-4 text-center">Chocolate Bar (16 pieces)</h4>
          <div id="chocolate-visual" class="flex justify-center"></div>
        </div>

        <!-- Pie -->
        <div class="visual-card bg-white/5 rounded-3xl p-6 border border-white/10">
          <h4 class="font-semibold mb-4 text-center">Pie</h4>
          <div id="pie-visual" class="flex justify-center"></div>
        </div>
      </div>
    </div>

    <div id="empty-state" class="text-center py-12 text-white/50">
      Tap a note above to explore its fraction
    </div>
  </div>

  <script>
    const MUSIC_FONT = 'Noto Music';
    const MUSIC_NOTE_CHARS = {
      semibreve: '\uD834\uDD5D',
      minim: '\uD834\uDD5E',
      crotchet: '\uD834\uDD5F',
      quaver: '\uD834\uDD60',
      semiquaver: '\uD834\uDD61',
    };
    const LEGACY_NOTE_CHARS = { crotchet: '♩', quaver: '♪' };
    const SVG_NOTE_TYPES = new Set(['semibreve', 'minim', 'semiquaver']);
    let useMusicFont = false;
    let lastExplore = null;

    const NOTE_SVG_SPECS = {
      semibreve: { id: 'note-semibreve', viewBox: '0 0 15.698 7.087', width: 95, height: 42 },
      minim: { id: 'note-minim', viewBox: '0 0 75 150', width: 48, height: 95 },
      semiquaver: { id: 'note-semiquaver', viewBox: '0 0 75 150', width: 48, height: 95 },
    };

    function noteSvgHtml(type, className = 'note-svg', size = 'md') {
      const spec = NOTE_SVG_SPECS[type];
      if (!spec) return '';
      if (size === 'lg') {
        return `<svg viewBox="${spec.viewBox}" class="${className}" aria-hidden="true"><use href="#${spec.id}"/></svg>`;
      }
      const sizes = {
        md: { semibreve: [spec.width, spec.height], minim: [spec.width, spec.height], semiquaver: [spec.width, spec.height] },
      };
      const [w, h] = (sizes[size] || sizes.md)[type] || [spec.width, spec.height];
      return `<svg width="${w}" height="${h}" viewBox="${spec.viewBox}" class="${className}" aria-hidden="true"><use href="#${spec.id}"/></svg>`;
    }

    async function initMusicFont() {
      if (!document.fonts) return;
      const testChar = MUSIC_NOTE_CHARS.semibreve;
      const fontSpec = `48px "${MUSIC_FONT}"`;
      try {
        const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 5000));
        await Promise.race([document.fonts.load(fontSpec, testChar), timeout]);
        await document.fonts.ready;
        if (!document.fonts.check(fontSpec, testChar)) return;
        useMusicFont = true;
        document.body.classList.add('music-font-ready');
        if (lastExplore) exploreNote(...lastExplore);
      } catch { /* SVG fallback */ }
    }

    function renderExplorerSymbol(symbolEl, type) {
      if (useMusicFont) {
        const semibreveSlot = type === 'semibreve' ? ' note-icon-slot--semibreve' : '';
        symbolEl.className = 'mb-2';
        symbolEl.innerHTML = `<div class="note-icon-slot note-icon-slot--lg${semibreveSlot} mx-auto md:mx-0"><span class="note-glyph music-font">${MUSIC_NOTE_CHARS[type]}</span></div>`;
      } else if (SVG_NOTE_TYPES.has(type)) {
        const wide = type === 'semibreve' ? ' note-svg--wide' : '';
        const semibreveSlot = type === 'semibreve' ? ' note-icon-slot--semibreve' : '';
        symbolEl.className = 'mb-2';
        symbolEl.innerHTML = `<div class="note-icon-slot note-icon-slot--lg${semibreveSlot} mx-auto md:mx-0">${noteSvgHtml(type, `note-svg${wide}`, 'lg')}</div>`;
      } else {
        symbolEl.className = 'text-8xl mb-2';
        symbolEl.textContent = LEGACY_NOTE_CHARS[type] || '';
      }
    }

    function exploreNote(type, beats, name) {
      lastExplore = [type, beats, name];
      document.getElementById('empty-state').classList.add('hidden');
      document.getElementById('explorer-display').classList.remove('hidden');

      document.getElementById('note-name').textContent = name;
      document.getElementById('note-beats').textContent = `${beats} beat${beats !== 1 ? 's' : ''}`;

      renderExplorerSymbol(document.getElementById('note-symbol'), type);

      updateEquivalents(type);
      const percent = (beats / 4) * 100;
      updateVisual('pizza-visual', percent, 'pizza');
      updateVisual('chocolate-visual', percent, 'chocolate');
      updateVisual('pie-visual', percent, 'pie');
    }

    function updateEquivalents(type) {
      const container = document.getElementById('equivalents');
      container.innerHTML = '';

      const map = {
        semibreve: ['2 Minims', '4 Crotchets', '8 Quavers'],
        minim: ['2 Crotchets', '4 Quavers', '½ Semibreve'],
        crotchet: ['2 Quavers', '4 Semiquavers', '½ Minim'],
        quaver: ['2 Semiquavers', '½ Crotchet', '¼ Minim'],
        semiquaver: ['½ Quaver', '¼ Crotchet', '⅛ Minim']
      };

      map[type].forEach(text => {
        const div = document.createElement('div');
        div.className = 'bg-white/10 px-4 py-3 rounded-2xl text-center';
        div.textContent = text;
        container.appendChild(div);
      });
    }

    function updateVisual(containerId, percent, type) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      if (type === 'pizza') container.appendChild(createPizza(percent));
      else if (type === 'chocolate') container.appendChild(createChocolate(percent));
      else if (type === 'pie') container.appendChild(createPie(percent));
    }

    function createPizza(percent) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("width", "120");
      svg.setAttribute("height", "120");
      svg.setAttribute("viewBox", "0 0 100 100");

      const angle = (percent / 100) * 360;

      const bg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      bg.setAttribute("cx", "50");
      bg.setAttribute("cy", "50");
      bg.setAttribute("r", "45");
      bg.setAttribute("fill", "#f4a261");
      svg.appendChild(bg);

      if (percent > 0) {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        const largeArc = angle > 180 ? 1 : 0;
        const rad = (angle - 90) * Math.PI / 180;
        const x = 50 + 45 * Math.cos(rad);
        const y = 50 + 45 * Math.sin(rad);
        const d = `M 50 50 L 50 5 A 45 45 0 ${largeArc} 1 ${x} ${y} Z`;
        path.setAttribute("d", d);
        path.setAttribute("fill", "#e76f51");
        svg.appendChild(path);
      }
      return svg;
    }

    function createChocolate(percent) {
      const div = document.createElement('div');
      div.className = 'grid grid-cols-8 gap-1 w-72';   // 16 blocks (2 rows of 8)
      
      // 16 blocks = each block = 6.25%
      const filled = Math.max(1, Math.floor(percent / 6.25));

      for (let i = 0; i < 16; i++) {
        const block = document.createElement('div');
        block.className = `aspect-square rounded-sm ${i < filled ? 'bg-amber-700' : 'bg-amber-950'} border border-amber-600`;
        div.appendChild(block);
      }
      return div;
    }

    function createPie(percent) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("width", "120");
      svg.setAttribute("height", "120");
      svg.setAttribute("viewBox", "0 0 100 100");

      const angle = (percent / 100) * 360;

      const bg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      bg.setAttribute("cx", "50");
      bg.setAttribute("cy", "50");
      bg.setAttribute("r", "45");
      bg.setAttribute("fill", "#64748b");
      svg.appendChild(bg);

      if (percent > 0) {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        const largeArc = angle > 180 ? 1 : 0;
        const rad = (angle - 90) * Math.PI / 180;
        const x = 50 + 45 * Math.cos(rad);
        const y = 50 + 45 * Math.sin(rad);
        const d = `M 50 50 L 50 5 A 45 45 0 ${largeArc} 1 ${x} ${y} Z`;
        path.setAttribute("d", d);
        path.setAttribute("fill", "#22c55e");
        svg.appendChild(path);
      }
      return svg;
    }

    if (window.self !== window.top) {
      document.body.classList.add('embedded');
    }

    initMusicFont();
    window.onload = () => exploreNote('crotchet', 1, 'Crotchet');
  </script>
</body>
</html>
